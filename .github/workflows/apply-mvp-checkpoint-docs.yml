name: Apply MVP checkpoint docs

on:
  push:
    branches: [docs-mvp-checkpoint]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-mvp-checkpoint

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply docs update
        run: python scripts/update_mvp_checkpoint_docs.py

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF.md docs/ROADMAP.md
          git commit -m "Record functional MVP checkpoint"
          git push origin HEAD:docs-mvp-checkpoint
