name: Apply widget config UI

on:
  push:
    branches: [feat-widget-source-config]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-widget-source-config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply UI patch
        run: python scripts/apply_widget_config_ui.py

      - name: Commit generated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/cache-ui.css
          git commit -m "Add contextual arXiv widget settings UI"
          git push origin HEAD:feat-widget-source-config
