name: Bootstrap Cargo.lock

on:
  push:
    branches: [ci-lockfile-reproducible]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-lockfile-reproducible

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git commit -m "Regenerate Cargo.lock"
          git push origin HEAD:ci-lockfile-reproducible
