name: Bootstrap Cargo.lock

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-cargo-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate application lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile and remove bootstrap workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/bootstrap-cargo-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/bootstrap-cargo-lock.yml
          git commit -m "Commit generated Cargo.lock"
          git push origin "HEAD:${HEAD_BRANCH}"
