name: CI / Windows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Materialize Windows icon
        shell: pwsh
        run: ./scripts/decode_windows_icon.ps1

      - name: Check Windows performance helper syntax
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw ./scripts/measure_idle_windows.ps1))'

      - name: Smoke Windows performance helper
        shell: pwsh
        run: ./scripts/measure_idle_windows.ps1 -RootPid $PID -SettleSeconds 0 -DurationSeconds 0.2 -IntervalSeconds 0.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Verify locked Rust dependencies
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 > $null
        shell: pwsh

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Tauri release build
        run: npm run tauri build -- --no-bundle --ci
